name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tax-engine
        run: npm run build --workspace=packages/tax-engine

      - name: Build client
        env:
          VITE_BASE_PATH: /tax-break/
          VITE_CALCULATION_MODE: local
        run: npm run build --workspace=client

      # While the Pages source is "Deploy from a branch", GitHub also runs its built-in
      # Jekyll `pages-build-deployment` workflow on every push to main. That build renders
      # README.md as the site home page and, because it finishes after this workflow, it
      # overwrites the uploaded client artifact. Switching the source to GitHub Actions
      # (build_type: workflow) stops the Jekyll build and serves the client instead.
      - name: Set Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" --silent 2>/dev/null; then
            gh api --method PUT "repos/$REPO/pages" -f build_type=workflow
            echo "Pages source set to GitHub Actions."
          elif gh api --method POST "repos/$REPO/pages" -f build_type=workflow; then
            echo "Pages enabled with GitHub Actions as the source."
          else
            echo "::error::Could not set the Pages source to GitHub Actions. Set it manually in Settings > Pages, or provide a PAGES_ENABLEMENT_TOKEN secret with permission to administer Pages."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
