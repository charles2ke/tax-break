name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tax-engine
        run: npm run build --workspace=packages/tax-engine

      - name: Build client
        env:
          VITE_BASE_PATH: /tax-break/
          VITE_CALCULATION_MODE: local
        run: npm run build --workspace=client

      - name: Check Pages enablement token
        id: pages-enable-token
        env:
          PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
        run: |
          if [ -n "$PAGES_ENABLEMENT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages with enablement token
        if: ${{ steps.pages-enable-token.outputs.available == 'true' }}
        uses: actions/configure-pages@v5
        with:
          # Ensures the Pages site is served from this workflow's artifact instead of a
          # branch/Jekyll build (which renders README.md as the site's home page).
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}

      - name: Setup Pages without enablement token
        if: ${{ steps.pages-enable-token.outputs.available == 'false' }}
        uses: actions/configure-pages@v5
        # Without PAGES_ENABLEMENT_TOKEN, this only configures metadata; the repository
        # source must already be set to GitHub Actions for the uploaded artifact to serve.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
