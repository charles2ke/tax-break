name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build tax-engine
        run: npm run build --workspace=packages/tax-engine

      - name: Test tax-engine
        run: npm test --workspace=packages/tax-engine

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client
        run: npm run build --workspace=client
